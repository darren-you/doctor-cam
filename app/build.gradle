plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'cn.darrenyou.doctorcam'
    compileSdk 35

    defaultConfig {
        applicationId "cn.darrenyou.doctorcam"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
        // 编译OpenCV
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags "-std=c++11"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ndkVersion '17.2.4988734'
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    
    // OpenCV
    implementation project(':opencv')

    // uvc摄像头
    implementation 'org.uvccamera:lib:0.0.13'

    // TensorFlow Lite 模型推理
//    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
//    implementation 'org.tensorflow:tensorflow-lite-support:0.5.0'
//    implementation 'org.tensorflow:tensorflow-lite-metadata:0.5.0'

//   'https://paddlelite-demo.bj.bcebos.com/libs/android/paddle_lite_libs_v2.13_rc.tar.gz'
//   'https://paddlelite-demo.bj.bcebos.com/libs/android/opencv-4.2.0-android-sdk.tar.gz'

    // ONNX Runtime依赖
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
}
